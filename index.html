        var map = L.map('map', { maxZoom: 23, zoomControl: false }).setView([-9.31014, -75.99172], 19);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        var googleSat = L.tileLayer('http://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 23, subdomains:['mt0','mt1','mt2','mt3'], attribution: '© Google Satellite'
        }).addTo(map);

        var esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, attribution: '© Esri' });
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OSM' });

        L.control.layers({ "Google Satélite": googleSat, "Esri Satélite": esriSat, "Mapa Calles (OSM)": osm }, null, { position: 'topleft' }).addTo(map);

        var spPolygons = {};
        var spGroup = L.featureGroup().addTo(map);
        var deadTreeMarkers = [];
        var treeGroup = L.featureGroup().addTo(map);
        var plotLayer = null;

        L.geoJSON(rawData, {
            style: function(feature) {
                if (feature.properties.is_polygon) {
                    var isPlot = feature.properties.name.includes("1 Hectárea");
                    return { color: feature.properties.color, weight: isPlot ? 3 : 1.5, dashArray: isPlot ? '6, 8' : '', fillOpacity: isPlot ? 0.05 : 0.02 };
                }
            },
            pointToLayer: function (feature, latlng) {
                return L.circleMarker(latlng, { radius: 6, fillColor: "#d32f2f", color: "#ffffff", weight: 1.5, opacity: 1, fillOpacity: 0.95 });
            },
            onEachFeature: function (feature, layer) {
                if (feature.properties.is_polygon) {
                    if (feature.properties.name.includes("1 Hectárea")) {
                        plotLayer = layer;
                    } else {
                        layer.bindTooltip("SP " + (feature.properties.sp_id < 10 ? "0" : "") + feature.properties.sp_id, { permanent: true, direction: 'center', className: 'sp-label' });
                        spPolygons[feature.properties.sp_id] = layer;
                        spGroup.addLayer(layer);
                    }
                } else {
                    var props = feature.properties;
                    var popupHtml = '<div class="popup-header">Árbol Muerto #' + props.cod + ' (SP ' + (props.sp < 10 ? '0' : '') + props.sp + ')</div>' +
                                    '<div class="popup-row"><b>Especie:</b> <i>' + props.especie + '</i></div>' +
                                    '<div class="popup-row"><b>Histórico DAP 2019:</b> ' + props.dap19 + ' | <b>2021:</b> ' + props.dap21 + '</div>' +
                                    '<div class="popup-row"><b>UTM WGS84:</b> E: ' + props.este + ' | N: ' + props.norte + '</div>' +
                                    '<div style="margin-top:6px; padding:4px; background:#ffebee; border-radius:4px; font-size:11px; color:#b71c1c;">' +
                                    '<b>Misión 2026:</b> Verificar si sigue de pie. Medir DAP actual, altura fuste y clase con machete (1, 2 o 3).</div>';
                    layer.bindPopup(popupHtml);
                    layer.bindTooltip(props.cod, { permanent: false, direction: 'top', className: 'dead-tree-label', offset: [0, -6] });
                    layer.sp_id = props.sp;
                    deadTreeMarkers.push(layer);
                    treeGroup.addLayer(layer);
                }
            }
        }).addTo(map);

        map.fitBounds(plotLayer.getBounds(), { padding: [30, 30] });

        window.filterSubparcela = function(val) {
            if (val === "ALL") {
                deadTreeMarkers.forEach(function(m) { treeGroup.addLayer(m); });
                map.fitBounds(plotLayer.getBounds(), { padding: [30, 30] });
            } else {
                var selectedSp = parseInt(val);
                deadTreeMarkers.forEach(function(m) { m.sp_id === selectedSp ? treeGroup.addLayer(m) : treeGroup.removeLayer(m); });
                if (spPolygons[selectedSp]) map.fitBounds(spPolygons[selectedSp].getBounds(), { maxZoom: 21, padding: [40, 40] });
            }
        };

        L.control.locate({
            position: 'topright',
            strings: { title: "Mostrar mi ubicación GPS en vivo" },
            locateOptions: { maxZoom: 22, enableHighAccuracy: true, watch: true },
            icon: 'leaflet-control-locate-location-arrow',
            circleStyle: { color: '#136AEC', fillColor: '#136AEC', fillOpacity: 0.15, opacity: 0.6, weight: 2 },
            markerStyle: { color: '#fff', fillColor: '#2A93EE', fillOpacity: 1, weight: 3, opacity: 1, radius: 8 }
        }).addTo(map);
